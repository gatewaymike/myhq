# Keeps the free Supabase project from pausing after a quiet week (Supabase emailed 2026-10-13).
# Interim only: suggested to switch to Supabase Pro at cutover, which never pauses.
# Reads one row through the public API with the publishable key (public by design, see .env.production).
# Anonymous callers are refused by Postgres (no table grants); the refusal itself shows the database is awake.
# Note: GitHub disables scheduled workflows in a public repo after 60 days without repository activity.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 2 */3 * *' # every 3 days, 02:17 UTC (10:17 Taipei)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Query the database once
        run: |
          set -a; . ./.env.production; set +a
          host="${VITE_SUPABASE_URL#https://}"
          echo "Host: $host"
          getent hosts "$host" || echo "DNS lookup failed for $host (a paused Supabase project may not resolve)"
          code=$(curl -sS --retry 3 --retry-all-errors --retry-delay 10 -o body.txt -w '%{http_code}' \
            "$VITE_SUPABASE_URL/rest/v1/devices?select=id&limit=1" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY")
          # No Authorization header: the new sb_publishable_ keys are not JWTs, so sending one as a Bearer token is rejected.
          echo "HTTP $code"; cat body.txt; echo
          # Anonymous callers have no grant on any table (by design: never "GRANT ... TO anon"), so Postgres itself
          # answers 401 with code 42501. That reply proves the database ran the query, which is the activity we need.
          # Anything else (unreachable, paused, a gateway error) fails the run, so GitHub emails the repo owner.
          if [ "$code" = "200" ] || grep -q '"42501"' body.txt; then echo "Database answered: awake."; else exit 1; fi
